<div
  class="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/50 p-3 sm:p-6"
  (click)="onOverlayClick($event)"
>
  <!-- MODAL -->
  <div
    class="flex w-full max-w-[1005px] max-h-[95vh] flex-col overflow-hidden rounded-lg bg-white shadow-2xl"
  >
    <!-- =========================
 HEADER
 ========================== -->

    <div
      class="flex shrink-0 items-center justify-between border-b border-slate-200 px-6 py-6 sm:px-10 sm:py-7"
    >
      <h2 class="tracking-[-0.5px] text-slate-900 text-2xl font-bold">Ajouter une dépense</h2>

      <button
        type="button"
        (click)="fermer()"
        aria-label="Fermer"
        class="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg bg-slate-50 text-slate-500 transition hover:bg-slate-100 text-sm font-semibold"
      >
        <svg
          class="h-7 w-7"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.8"
        >
          <circle cx="12" cy="12" r="9" />

          <path d="m9 9 6 6" />
          <path d="m15 9-6 6" />
        </svg>
      </button>
    </div>

    <!-- =========================
 FORMULAIRE
 ========================== -->

    <form [formGroup]="expenseForm" (ngSubmit)="enregistrer()" class="overflow-y-auto">
      <div class="space-y-7 px-6 py-7 sm:px-10 sm:py-9">
        <!-- =========================
 PROJET + ÉTAPE
 ========================== -->

        <div class="grid grid-cols-1 gap-6 md:grid-cols-2">
          <!-- PROJET -->

          <div>
            <label for="projet" class="mb-3 block text-slate-900 text-sm font-semibold">
              Projet
            </label>

            <div class="relative">
              <select
                id="projet"
                formControlName="projet"
                class="h-[60px] w-full appearance-none rounded-lg border-2 border-slate-200 bg-white px-5 pr-14 text-slate-500 outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-100 text-sm font-normal"
              >
                <option value="" disabled>Sélectionnez un projet</option>
                @for (project of projets(); track project.id) {
                  <option [value]="project.id">{{ project.nom }}</option>
                }
              </select>

              <svg
                class="pointer-events-none absolute right-5 top-1/2 h-7 w-7 -translate-y-1/2 text-slate-500"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
              >
                <path d="m6 9 6 12 6-12" />
              </svg>
            </div>
          </div>

          <!-- ÉTAPE -->

          <div>
            <label for="etape" class="mb-3 block text-slate-900 text-sm font-semibold">
              Étape
            </label>

            <div class="relative">
              <select
                id="etape"
                formControlName="etape"
                class="h-[60px] w-full appearance-none rounded-lg border-2 border-slate-200 bg-white px-5 pr-14 text-slate-500 outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-100 text-sm font-normal"
              >
                <option value="" disabled>
                  {{ etapes().length ? 'Sélectionnez une étape' : 'Aucune étape disponible' }}
                </option>
                @for (step of etapes(); track step.id) {
                  <option [value]="step.id">{{ step.nom }}</option>
                }
              </select>

              <svg
                class="pointer-events-none absolute right-5 top-1/2 h-7 w-7 -translate-y-1/2 text-slate-500"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
              >
                <path d="m6 9 6 12 6-12" />
              </svg>
            </div>
          </div>
        </div>

        <!-- =========================
 LIBELLÉ
 ========================== -->

        <div>
          <label for="libelle" class="mb-3 block text-slate-900 text-sm font-semibold">
            Libellé de la dépense
          </label>

          <input
            id="libelle"
            type="text"
            formControlName="libelle"
            placeholder="Libellé de la dépense"
            class="h-[60px] w-full rounded-lg border-2 border-slate-200 px-5 text-slate-700 outline-none placeholder:text-slate-400 focus:border-sky-500 focus:ring-2 focus:ring-sky-100 text-sm font-normal"
          />
        </div>

        <!-- =========================
 MONTANT + DATE
 ========================== -->

        <div class="grid grid-cols-1 gap-6 md:grid-cols-2">
          <!-- MONTANT -->

          <div>
            <label for="montant" class="mb-3 block text-slate-900 text-sm font-semibold">
              Montant en FCFA
            </label>

            <input
              id="montant"
              type="number"
              formControlName="montant"
              min="1"
              step="1"
              inputmode="numeric"
              placeholder="Ex : 2 500 000"
              class="h-[60px] w-full rounded-lg border-2 border-slate-200 px-5 text-slate-700 outline-none placeholder:text-slate-400 focus:border-sky-500 focus:ring-2 focus:ring-sky-100 text-sm font-normal"
            />
          </div>

          <!-- DATE DE LA DÉPENSE -->

          <div>
            <label for="dateDepense" class="mb-3 block text-slate-900 text-sm font-semibold">
              Date de la dépense
            </label>

            <input
              id="dateDepense"
              type="date"
              formControlName="dateDepense"
              class="h-[60px] w-full rounded-lg border-2 border-slate-200 bg-white px-5 text-slate-500 outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-100 text-sm font-normal"
            />
          </div>
        </div>

        <!-- =========================
 FOURNISSEUR
 ========================== -->

        <div>
          <label for="fournisseur" class="mb-3 block text-slate-900 text-sm font-semibold">
            Fournisseur
          </label>

          <textarea
            id="fournisseur"
            formControlName="fournisseur"
            rows="3"
            placeholder="Nom du fournisseur (facultatif)"
            class="w-full resize-none rounded-lg border-2 border-slate-200 px-5 py-4 text-slate-700 outline-none placeholder:text-slate-400 focus:border-sky-500 focus:ring-2 focus:ring-sky-100 text-sm font-normal"
          ></textarea>
        </div>

        <!-- =========================
 UPLOAD JUSTIFICATIF
 ========================== -->

        <div>
          <label class="mb-3 block text-slate-900 text-sm font-semibold">
            Ajouter un justificatif
          </label>

          <label
            for="justificatif"
            class="flex min-h-[150px] cursor-pointer flex-col items-center justify-center rounded-lg border-2 border-dashed border-sky-500 bg-slate-50 px-5 py-8 text-center transition hover:bg-sky-50 text-sm font-semibold"
            (drop)="onDrop($event)"
            (dragover)="onDragOver($event)"
          >
            <input
              id="justificatif"
              type="file"
              accept=".pdf,.jpg,.jpeg,.png"
              class="hidden text-sm font-normal"
              (change)="onFileSelected($event)"
            />

            @if (!selectedFile()) {
              <!-- ICÔNE DE TÉLÉVERSEMENT -->

              <svg
                class="mb-4 h-9 w-9 text-sky-600"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.2"
              >
                <path d="M12 16V4" />

                <path d="m7 9 5-5 5 5" />

                <path
                  d="M5 15v4a1 1 0 0 0 1 1h12
 a1 1 0 0 0 1-1v-4"
                />
              </svg>

              <p class="font-bold text-slate-900">
                Glissez votre justificatif ici ou cliquez pour parcourir
              </p>

              <p class="mt-2 text-slate-500">PDF, JPG, PNG — Max 10 Mo</p>
            } @else {
              <svg
                class="mb-3 h-9 w-9 text-emerald-500"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="M5 12.5 9.5 17 19 7" />
              </svg>

              <p class="max-w-full truncate font-bold text-slate-900">
                {{ selectedFile()!.name }}
              </p>

              <p class="mt-2 text-sm text-slate-500">
                {{ (selectedFile()!.size / 1024 / 1024).toFixed(2) }} Mo
              </p>

              <button
                type="button"
                (click)="supprimerFichier()"
                class="mt-3 text-red-500 hover:text-red-600 text-sm font-semibold"
              >
                Supprimer le fichier
              </button>
            }
          </label>
        </div>
        @if (info()) {
          <p class="rounded-lg bg-amber-50 p-3 text-sm font-semibold text-amber-800">
            {{ info() }}
          </p>
        }
        @if (erreur()) {
          <p class="rounded-lg bg-red-50 p-3 text-sm font-semibold text-red-700">{{ erreur() }}</p>
        }
      </div>

      <!-- =========================
 FOOTER
 ========================== -->

      <div class="mx-6 border-t-2 border-slate-200 sm:mx-10"></div>

      <div
        class="flex flex-col-reverse gap-3 px-6 py-6 sm:flex-row sm:justify-end sm:px-10 sm:py-7"
      >
        <!-- ANNULER -->

        <button
          type="button"
          (click)="fermer()"
          class="h-[60px] w-full rounded-lg border-2 border-[#0284C7] bg-white px-8 text-[#0284C7] transition hover:bg-slate-50 sm:w-auto text-sm font-semibold"
        >
          Annuler
        </button>

        <!-- ENREGISTRER -->

        <button
          type="submit"
          [disabled]="expenseForm.invalid || isSubmitting()"
          class="h-[60px] w-full rounded-lg bg-[#0284C7] px-8 text-white transition hover:bg-[#067bb9] disabled:cursor-not-allowed disabled:opacity-50 sm:w-auto text-sm font-semibold"
        >
          @if (isSubmitting()) {
            Enregistrement...
          } @else {
            Enregistrer la dépense
          }
        </button>
      </div>
    </form>
  </div>
</div>
