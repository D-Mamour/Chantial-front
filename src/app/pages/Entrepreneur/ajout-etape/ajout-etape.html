@if (isOpen) {
  <!-- Overlay -->
  <div
    class="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/50 p-3 backdrop-blur-[1px] sm:p-6"
    (click)="close()"
  >
    <!-- Modal -->
    <div
      class="relative flex max-h-[95vh] w-full max-w-[875px] flex-col overflow-hidden rounded-2xl bg-white shadow-2xl sm:max-h-[90vh]"
      (click)="$event.stopPropagation()"
    >
      <!-- ================= HEADER ================= -->
      <div
        class="flex shrink-0 items-center justify-between border-b border-slate-200 px-5 py-5 sm:px-8 sm:py-6"
      >
        <h2 class="text-xl font-bold text-slate-900 sm:text-[28px]">Ajouter une étape</h2>

        <button
          type="button"
          (click)="close()"
          aria-label="Fermer"
          class="flex h-9 w-9 items-center justify-center rounded-lg bg-slate-50 text-slate-500 transition hover:bg-slate-100 hover:text-slate-700"
        >
          <svg
            class="h-6 w-6"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.8"
          >
            <circle cx="12" cy="12" r="9" />

            <path d="m9 9 6 6" />
            <path d="m15 9-6 6" />
          </svg>
        </button>
      </div>

      <!-- ================= BODY ================= -->
      <form [formGroup]="stepForm" (ngSubmit)="submit()" class="overflow-y-auto">
        <div class="space-y-6 px-5 py-6 sm:px-9 sm:py-8">
          <!-- Nom de l'étape -->
          <div>
            <label for="stepName" class="mb-2 block text-base font-bold text-slate-900">
              Nom de l'étape
            </label>

            <div class="relative">
              <select
                id="stepName"
                formControlName="name"
                class="h-14 w-full appearance-none rounded-xl border border-slate-200 bg-white px-5 pr-12 text-base text-slate-600 outline-none transition focus:border-sky-500 focus:ring-2 focus:ring-sky-100"
              >
                <option value="">Sélectionner une étape</option>

                <option value="Fondations">Fondations</option>

                <option value="Élévation">Élévation</option>

                <option value="Toiture">Toiture</option>

                <option value="Second œuvre">Second œuvre</option>

                <option value="Revêtement">Revêtement</option>

                <option value="Finitions">Finitions</option>
              </select>

              <!-- Chevron -->
              <svg
                class="pointer-events-none absolute right-4 top-1/2 h-6 w-6 -translate-y-1/2 text-slate-500"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
              >
                <path d="m6 9 6 12 6-12" />
              </svg>
            </div>
          </div>

          <!-- Ordre -->
          <div>
            <label for="order" class="mb-2 block text-base font-bold text-slate-900">
              Ordre dans le projet
            </label>

            <input
              id="order"
              type="number"
              formControlName="order"
              placeholder="Ex: 1"
              class="h-14 w-full rounded-xl border border-slate-200 px-5 text-base text-slate-700 outline-none placeholder:text-slate-400 focus:border-sky-500 focus:ring-2 focus:ring-sky-100"
            />
          </div>

          <!-- Budget -->
          <div>
            <label for="budget" class="mb-2 block text-base font-bold text-slate-900">
              Budget prévisionnel en FCFA
            </label>

            <input
              id="budget"
              type="number"
              formControlName="budget"
              placeholder="Ex: 25 000 000"
              class="h-14 w-full rounded-xl border border-slate-200 px-5 text-base text-slate-700 outline-none placeholder:text-slate-400 focus:border-sky-500 focus:ring-2 focus:ring-sky-100"
            />
          </div>

          <!-- Dates -->
          <div class="grid grid-cols-1 gap-5 sm:grid-cols-2">
            <!-- Date début -->
            <div>
              <label for="startDate" class="mb-2 block text-base font-bold text-slate-900">
                Date de début prévue
              </label>

              <div class="relative">
                <input
                  id="startDate"
                  type="date"
                  formControlName="startDate"
                  class="h-14 w-full rounded-xl border border-slate-200 bg-white px-5 pr-12 text-base text-slate-500 outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-100"
                />

                <svg
                  class="pointer-events-none absolute right-4 top-1/2 h-5 w-5 -translate-y-1/2 text-slate-500"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.5"
                >
                  <rect x="3" y="4" width="18" height="18" rx="2" />

                  <path d="M16 2v4" />
                  <path d="M8 2v4" />
                  <path d="M3 10h18" />
                </svg>
              </div>
            </div>

            <!-- Date fin -->
            <div>
              <label for="endDate" class="mb-2 block text-base font-bold text-slate-900">
                Date de fin prévue
              </label>

              <div class="relative">
                <input
                  id="endDate"
                  type="date"
                  formControlName="endDate"
                  class="h-14 w-full rounded-xl border border-slate-200 bg-white px-5 pr-12 text-base text-slate-500 outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-100"
                />

                <svg
                  class="pointer-events-none absolute right-4 top-1/2 h-5 w-5 -translate-y-1/2 text-slate-500"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.5"
                >
                  <rect x="3" y="4" width="18" height="18" rx="2" />

                  <path d="M16 2v4" />
                  <path d="M8 2v4" />
                  <path d="M3 10h18" />
                </svg>
              </div>
            </div>
          </div>

          <!-- Description -->
          <div>
            <label for="description" class="mb-2 block text-base font-bold text-slate-900">
              Description / Notes
            </label>

            <textarea
              id="description"
              formControlName="description"
              rows="3"
              placeholder="Notes ou spécifications pour cette étape..."
              class="w-full resize-none rounded-xl border border-slate-200 px-5 py-4 text-base text-slate-700 outline-none placeholder:text-slate-400 focus:border-sky-500 focus:ring-2 focus:ring-sky-100"
            >
            </textarea>
          </div>
        </div>

        <!-- ================= FOOTER ================= -->
        <div
          class="flex shrink-0 flex-col-reverse gap-3 border-t border-slate-200 px-5 py-5 sm:flex-row sm:justify-end sm:px-9 sm:py-6"
        >
          <!-- Annuler -->
          <button
            type="button"
            (click)="close()"
            class="h-14 w-full rounded-xl border border-slate-200 bg-white px-6 text-base font-bold text-slate-500 transition hover:bg-slate-50 sm:w-auto"
          >
            Annuler
          </button>

          <!-- Ajouter -->
          <button
            type="submit"
            [disabled]="stepForm.invalid"
            class="h-14 w-full rounded-xl bg-[#0788cf] px-7 text-base font-bold text-white shadow-sm transition hover:bg-[#067bb9] disabled:cursor-not-allowed disabled:opacity-50 sm:w-auto"
          >
            Ajouter l'étape
          </button>
        </div>
      </form>
    </div>
  </div>
}
