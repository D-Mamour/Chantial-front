<!-- Overlay -->

<div
 class="fixed inset-0 z-[100] flex items-center justify-center bg-[#0F172A]/50 p-3 sm:p-5 lg:p-8"
 role="presentation"
 (click)="onOverlayClick($event)"
>
 <!-- Modal -->

 <div
 class="flex w-full max-w-[960px] max-h-[95vh] flex-col overflow-hidden rounded-lg bg-white shadow-2xl sm:max-h-[92vh]"
 role="dialog" aria-modal="true" aria-labelledby="titre-demande"
 >
 <!-- Header -->

 <header
 class="flex shrink-0 items-center justify-between border-b border-[#E2E8F0] px-5 py-5 sm:px-8 sm:py-6"
 >
 <h2 id="titre-demande" class="text-[#0F172A] text-2xl font-bold">Nouvelle demande</h2>

 <button
 type="button"
 (click)="fermer()"
 aria-label="Fermer"
 class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg bg-[#F8FAFC] text-[#64748B] hover:bg-[#E2E8F0] text-sm font-semibold"
 >
 <i class="fa-solid fa-xmark text-2xl"></i>
 </button>
 </header>

 <!-- Formulaire -->

 <form
 [formGroup]="requestForm"
 (ngSubmit)="envoyerDemande()"
 class="overflow-y-auto px-5 py-6 sm:px-8 lg:px-10 lg:py-7"
 >
 <!-- Type de demande -->

 <div class="mb-8">
 <label class="mb-3 block uppercase tracking-wide text-[#64748B] text-sm font-semibold">
 Type de demande
 </label>

 <div class="grid grid-cols-1 gap-3 sm:grid-cols-2">
 <!-- Justification -->

 <label
 class="flex min-h-16 cursor-pointer items-center gap-3 rounded-lg border-2 px-5 py-3 transition text-sm font-semibold"
 [class.border-[#0284C7]]="requestForm.controls.type.value === 'justification'"
 [class.bg-[#DFF2FC]]="requestForm.controls.type.value === 'justification'"
 [class.border-[#E2E8F0]]="requestForm.controls.type.value !== 'justification'"
 >
 <input
 type="radio"
 value="justification"
 formControlName="type"
 class="h-5 w-5 accent-[#0284C7] text-sm font-normal"
 />

 <span
 class="text-base font-semibold"
 [class.text-[#0284C7]]="requestForm.controls.type.value === 'justification'"
 [class.text-[#0F172A]]="requestForm.controls.type.value !== 'justification'"
 >
 Demander une justification
 </span>
 </label>

 <!-- Correction -->

 <label
 class="flex min-h-16 cursor-pointer items-center gap-3 rounded-lg border-2 px-5 py-3 transition text-sm font-semibold"
 [class.border-[#0284C7]]="requestForm.controls.type.value === 'correction'"
 [class.bg-[#DFF2FC]]="requestForm.controls.type.value === 'correction'"
 [class.border-[#E2E8F0]]="requestForm.controls.type.value !== 'correction'"
 >
 <input
 type="radio"
 value="correction"
 formControlName="type"
 class="h-5 w-5 accent-[#0284C7] text-sm font-normal"
 />

 <span
 class="text-base font-semibold"
 [class.text-[#0284C7]]="requestForm.controls.type.value === 'correction'"
 [class.text-[#0F172A]]="requestForm.controls.type.value !== 'correction'"
 >
 Demander une correction
 </span>
 </label>
 </div>
 </div>

 <!-- Élément concerné -->

 <div class="mb-7">
 <label
 for="element"
 class="mb-3 block uppercase tracking-wide text-[#64748B] text-sm font-semibold"
 >
 Élément concerné
 </label>

 <div class="relative">
 <select
 id="element"
 formControlName="element"
 class="h-14 w-full appearance-none rounded-lg border border-[#E2E8F0] bg-white px-5 pr-12 text-[#0F172A] outline-none focus:border-[#0284C7] focus:ring-2 focus:ring-[#0284C7]/10 text-sm font-normal"
 >
 <option value="" disabled>Sélectionner un élément</option>

 @for (element of elements(); track element.id) {
 <option [value]="element.id">{{ element.libelle }} — {{ element.montant }} FCFA</option>
 }
 </select>

 <i
 class="fa-solid fa-chevron-down pointer-events-none absolute right-5 top-1/2 -translate-y-1/2 text-[#64748B]"
 ></i>
 </div>
 </div>

 <!-- Message -->

 <div class="mb-8">
 <label
 for="message"
 class="mb-3 block uppercase tracking-wide text-[#64748B] text-sm font-semibold"
 >
 Message explicatif
 </label>

 <textarea
 id="message"
 formControlName="message"
 rows="5"
 placeholder="Expliquez votre demande..."
 class="w-full resize-none rounded-lg border border-[#E2E8F0] px-5 py-4 text-[#0F172A] outline-none placeholder:text-[#64748B] focus:border-[#0284C7] focus:ring-2 focus:ring-[#0284C7]/10 text-sm font-normal"
 ></textarea>

 @if (requestForm.controls.message.touched && requestForm.controls.message.invalid) {
 <p class="mt-2 text-sm text-red-500">Le message doit contenir au moins 10 caractères.</p>
 }
 </div>

 <!-- Prévisualisation du statut -->

 <div class="mb-8 rounded-lg bg-[#F8FAFC] px-5 py-5 sm:px-6">
 <h3 class="mb-5 uppercase tracking-wide text-[#64748B] text-lg font-semibold">
 Statut de la demande
 </h3>

 <div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
 <div class="flex items-center gap-3">
 <span class="h-5 w-5 rounded-lg bg-[#0284C7]"></span>

 <span class="text-base font-semibold text-[#0284C7]"> Envoyée </span>
 </div>

 <div class="hidden h-0.5 flex-1 bg-[#E2E8F0] sm:block"></div>

 <div class="flex items-center gap-3">
 <span class="h-5 w-5 rounded-lg bg-[#64748B]"></span>

 <span class="text-base text-[#64748B]"> En cours de traitement </span>
 </div>

 <div class="hidden h-0.5 flex-1 bg-[#E2E8F0] sm:block"></div>

 <div class="flex items-center gap-3">
 <span class="h-5 w-5 rounded-lg bg-[#64748B]"></span>

 <span class="text-base text-[#64748B]"> Répondue </span>
 </div>
 </div>
 </div>

 @if (erreur()) {
 <p class="mb-5 rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm font-medium text-red-700" role="alert">{{ erreur() }}</p>
 }

 <!-- Footer -->

 <div
 class="flex flex-col-reverse gap-3 border-t border-[#E2E8F0] pt-6 sm:flex-row sm:justify-end"
 >
 <button
 type="button"
 (click)="fermer()"
 class="h-12 w-full rounded-lg border border-[#E2E8F0] bg-white px-7 text-[#64748B] hover:bg-[#F8FAFC] sm:w-auto text-sm font-semibold"
 >
 Annuler
 </button>

 <button
 type="submit"
 [disabled]="isSubmitting()"
 class="h-12 w-full rounded-lg bg-[#0284C7] px-7 text-white hover:bg-[#0284C7] disabled:cursor-not-allowed disabled:opacity-60 sm:w-auto text-sm font-semibold"
 >
 @if (isSubmitting()) {
 <span class="flex items-center justify-center gap-2">
 <i class="fa-solid fa-spinner animate-spin"></i>

 Envoi...
 </span>
 } @else {
 Envoyer la demande
 }
 </button>
 </div>
 </form>
 </div>
</div>
